name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for RubyGems trusted publishing
      contents: write # required to push the release tag

    # Must match the environment configured on RubyGems.org
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Release gem
        uses: rubygems/release-gem@v1
